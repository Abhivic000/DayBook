# Runs on every push to main and every pull request (NFR-6).
# One job: full build with all tests, then the smoke test against the real app.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compiles with Error Prone, checks formatting (Spotless), runs unit tests and the
      # Testcontainers integration tests (Docker is available on GitHub's Ubuntu runners).
      - name: Build and test
        run: ./mvnw -B -ntp verify

      # Alert rules and scrape config are code too: promtool rejects syntax errors and bad queries.
      - name: Check Prometheus config and alert rules
        run: >-
          docker run --rm -v "$PWD/ops/prometheus:/etc/prometheus:ro" --entrypoint promtool
          prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml

      - name: Start Postgres and Kafka
        run: docker compose up -d --wait postgres kafka

      # Real processes, real hard kill: events committed before the API dies are published after
      # restart and projected exactly once. Runs before the smoke test, whose long-running API
      # would otherwise publish the events this test needs to keep unpublished.
      - name: Crash test
        shell: pwsh
        run: ./scripts/crash-test.ps1

      - name: Show crash-test logs
        if: failure()
        run: cat /tmp/daybook-crash-test-*/*.log || true

      # The 'local' profile carries throwaway dev credentials that match compose.yaml.
      - name: Start the API
        run: |
          nohup java -Duser.timezone=UTC -jar daybook-api/target/daybook-api-*.jar \
            --spring.profiles.active=local > app.log 2>&1 &

      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke.ps1

      - name: Show API log
        if: failure()
        run: cat app.log || true

      # The same smoke test against the containerised stack: proves the Dockerfile and
      # compose.yaml, not just the jar. The host-run API is stopped first to free port 8080.
      - name: Start the full stack in Docker
        run: |
          pkill -f 'daybook-api-.*\.jar' || true
          docker compose up -d --build --wait

      - name: Smoke test (Docker stack)
        shell: pwsh
        run: ./scripts/smoke.ps1

      - name: Show stack logs
        if: failure()
        run: docker compose logs --no-color --tail 200 api consumer psp-sim || true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7
