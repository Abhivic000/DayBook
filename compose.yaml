# The whole Daybook stack (ADR 0019).
#
#   docker compose up -d --build --wait     everything: apps, databases, monitoring
#   docker compose up -d --wait postgres kafka
#                                           databases only, for running the apps from Maven/IDE
#   docker compose down                     stop (data kept)       down -v   stop and wipe data
#
# Credentials below are throwaway development defaults. Override any of them in a .env file next
# to this one (see .env.example); never commit real secrets.
#
#   API http://localhost:8080 (Swagger UI /swagger-ui/index.html)   Consumer http://localhost:8082
#   Grafana http://localhost:3000   Prometheus http://localhost:9090   PSP simulator :8090

x-app-env: &app-env
  # One line of JSON per log event (ECS format), with traceId/spanId/tenantId fields.
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  DAYBOOK_DB_URL: jdbc:postgresql://postgres:5432/daybook
  DAYBOOK_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  # SHA-256 of the dev admin key "dev-admin-key".
  DAYBOOK_ADMIN_KEY_SHA256: ${DAYBOOK_ADMIN_KEY_SHA256:-df76ff796f70d2c9cb055ea6280553caa27eda26b70e01082c160de75a05a4a9}
  # Traces to Tempo; keep every trace in the local stack (production default is 10%).
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: daybook
      POSTGRES_USER: daybook
      POSTGRES_PASSWORD: ${DAYBOOK_DB_PASSWORD:-daybook}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daybook -d daybook"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper). Two listeners, because a client reconnects to
  # whatever address the broker advertises: containers use kafka:19092, apps on the host use
  # localhost:9092.
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # One broker, so internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  psp-sim:
    build:
      context: .
      args:
        MODULE: daybook-psp-sim
    image: daybook-psp-sim:local
    ports:
      - "8090:8090"
    environment:
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8090/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      args:
        MODULE: daybook-api
    image: daybook-api:local
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
      DAYBOOK_DB_USER: daybook
      DAYBOOK_DB_PASSWORD: ${DAYBOOK_DB_PASSWORD:-daybook}
      # Password migration V6 gives the consumer's database role (ADR 0013).
      DAYBOOK_CONSUMER_DB_PASSWORD: ${DAYBOOK_CONSUMER_DB_PASSWORD:-daybook_consumer}
      DAYBOOK_PSP_BASEURL: http://psp-sim:8090
      # The API docs are part of the product surface of this demo stack.
      SPRINGDOC_API_DOCS_ENABLED: "true"
      SPRINGDOC_SWAGGER_UI_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      psp-sim:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      # Readiness = app started + database reachable (ADR 0014).
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 40

  consumer:
    build:
      context: .
      args:
        MODULE: daybook-consumer
    image: daybook-consumer:local
    ports:
      - "8082:8082"
    environment:
      <<: *app-env
      DAYBOOK_CONSUMER_DB_USER: daybook_consumer
      DAYBOOK_CONSUMER_DB_PASSWORD: ${DAYBOOK_CONSUMER_DB_PASSWORD:-daybook_consumer}
    depends_on:
      # The API's migrations create the consumer's database role, so the API must be up first.
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 40

  # --- Monitoring -------------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Keep sample trace ids on histograms, so latency graphs link to traces.
      - --enable-feature=exemplar-storage
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
    depends_on:
      - api
      - consumer

  tempo:
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"
    volumes:
      - ./ops/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Viewing dashboards needs no login on this local stack.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/daybook.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo

volumes:
  postgres-data:
