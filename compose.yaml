# Local infrastructure: PostgreSQL and a single Kafka broker.
# Start: docker compose up -d     Stop: docker compose down     Wipe data: docker compose down -v
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: daybook
      POSTGRES_USER: daybook
      POSTGRES_PASSWORD: ${DAYBOOK_DB_PASSWORD:-daybook}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daybook -d daybook"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper). The image's defaults run one
  # combined broker/controller that advertises localhost:9092 to host clients.
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  postgres-data:
