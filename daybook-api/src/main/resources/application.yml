# Base configuration. Anything environment-specific or secret comes from
# environment variables; there are deliberately no defaults for credentials.
spring:
  application:
    name: daybook-api
  datasource:
    url: ${DAYBOOK_DB_URL}
    username: ${DAYBOOK_DB_USER}
    password: ${DAYBOOK_DB_PASSWORD}
    hikari:
      # Connections held open to PostgreSQL. Measured (README, "Where it saturates"): 20 was no
      # faster than 10 — under hot-account load the extra connections only queue on the same row
      # lock. Every API instance × this value must stay below Postgres's max_connections (100).
      maximum-pool-size: ${DAYBOOK_DB_POOL_SIZE:10}
  flyway:
    # Schema is owned by versioned migrations in db/migration — never auto-generated.
    locations: classpath:db/migration
    placeholders:
      # Password for the consumer's database role, created by migration V6 (ADR 0013).
      consumer-password: ${DAYBOOK_CONSUMER_DB_PASSWORD}
  kafka:
    bootstrap-servers: ${DAYBOOK_KAFKA_BOOTSTRAP_SERVERS}
    producer:
      # Wait for the broker to fully persist each record before counting it as sent.
      acks: all
      properties:
        # The producer de-duplicates its own retries and keeps per-partition order.
        enable.idempotence: true
        # Fail fast when the broker is down, so a relay cycle never stalls for minutes;
        # unsent events simply stay in the outbox until the next cycle.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 15000
    template:
      # Each send becomes a producer span and adds a W3C traceparent header for the consumer.
      observation-enabled: true
  mvc:
    problemdetails:
      # RFC 9457 bodies for framework errors not covered by ApiExceptionHandler.
      enabled: true
  task:
    scheduling:
      pool:
        # Spring runs all @Scheduled jobs on ONE thread by default. The sweeper makes PSP calls
        # that can each take seconds; on a shared single thread it would stall the outbox relay
        # (every 200ms) and delay every event.
        size: 4

daybook:
  security:
    # SHA-256 (hex) of the admin API key. Empty = admin endpoints disabled (fail closed).
    admin-key-sha256: ${DAYBOOK_ADMIN_KEY_SHA256:}

springdoc:
  # Generated OpenAPI spec and Swagger UI are off unless a profile turns them on (FR-12.4).
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        # prometheus: the scrape endpoint (FR-11.3). Unauthenticated like health — it carries no
        # tenant data (no metric is tagged by tenant) and is meant for the internal network only.
        include: health,info,prometheus
  endpoint:
    health:
      # Exposes /actuator/health/liveness and /actuator/health/readiness (FR-11.5).
      probes:
        enabled: true
      group:
        # Readiness = "send me traffic": the database is essential, Kafka is deliberately NOT
        # included — the outbox lets the API keep serving through a Kafka outage (ADR 0014).
        readiness:
          include: readinessState,db
          show-components: always
        # Liveness = "restart me": never depends on the database; a restart cannot fix it.
        liveness:
          include: livenessState
  tracing:
    sampling:
      # Share of traces kept. 10% is a production-style default; Docker Compose sets 1.0 so every
      # request can be inspected. Spans are exported only when
      # management.opentelemetry.tracing.export.otlp.endpoint is set (ADR 0019).
      probability: 0.1
  metrics:
    tags:
      # Every metric carries the app name, so one dashboard can tell API and consumer apart.
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # Latency histograms, so Prometheus can compute p50/p95/p99 across instances (FR-11.3).
        http.server.requests: true
