# Test-only settings, layered on top of src/main/resources/application.yml.
# Password for the consumer role created by migration V6 in the test database.
spring.flyway.placeholders.consumer-password=test-consumer-password

# PSP resilience, scaled down so failure-path tests run in milliseconds, not seconds.
daybook.psp.read-timeout=PT0.5S
daybook.psp.retry.initial-backoff=PT0.02S
daybook.psp.circuit-breaker.sliding-window-size=10
daybook.psp.circuit-breaker.minimum-number-of-calls=5
