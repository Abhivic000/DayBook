# Spring framework (not Boot) settings for the test JVM.
#
# Keep only one test ApplicationContext alive at a time. Every live context runs
# its own scheduled jobs (outbox relay, purges) against the shared test database,
# so tests that switch the relay off (OutboxCrashRecoveryIT) would otherwise see
# other classes' relays publish their events. It also keeps the number of open
# database connections to a single pool.
spring.test.context.cache.maxSize=1
