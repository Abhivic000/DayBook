# Local development only. Activated with --spring.profiles.active=local.
# Throwaway dev credentials matching compose.yaml and the API's local profile.
# The API must have started once first: its migration V6 creates this role.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/daybook
    username: daybook_consumer
    password: daybook_consumer
  kafka:
    bootstrap-servers: localhost:9092

daybook:
  security:
    # SHA-256 of the dev admin key "dev-admin-key" (same as the API's local profile).
    admin-key-sha256: df76ff796f70d2c9cb055ea6280553caa27eda26b70e01082c160de75a05a4a9
