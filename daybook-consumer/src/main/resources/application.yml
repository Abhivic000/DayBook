# Consumer service configuration. Connection details and credentials come from
# environment variables; there are deliberately no defaults for credentials.
server:
  port: 8082

spring:
  application:
    name: daybook-consumer
  datasource:
    url: ${DAYBOOK_DB_URL}
    # The consumer's own least-privileged role (ADR 0005, 0013).
    username: ${DAYBOOK_CONSUMER_DB_USER}
    password: ${DAYBOOK_CONSUMER_DB_PASSWORD}
  flyway:
    # Migrations for the projection schema only, with their own history table inside it.
    schemas: projection
    default-schema: projection
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${DAYBOOK_KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      # A brand-new consumer group starts from the oldest retained event, so the
      # projection can be rebuilt by consuming with a fresh group.
      auto-offset-reset: earliest
    listener:
      # Up to 3 partitions processed in parallel; each partition is still read in order.
      concurrency: 3
      # Each record is processed inside a span continuing the trace from its traceparent header,
      # i.e. the API request that caused it (FR-11.4).
      observation-enabled: true
    template:
      # Dead-letter publishing keeps the trace too.
      observation-enabled: true

  mvc:
    problemdetails:
      # RFC 9457 error bodies (e.g. an invalid ?limit on the DLQ endpoint).
      enabled: true

daybook:
  security:
    # SHA-256 (hex) of the admin key, same as the API's. Empty = admin endpoints disabled.
    admin-key-sha256: ${DAYBOOK_ADMIN_KEY_SHA256:}

management:
  endpoints:
    web:
      exposure:
        # prometheus: the scrape endpoint (FR-11.3). Unauthenticated like health — it carries no
        # tenant data (no metric is tagged by tenant) and is meant for the internal network only.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Database only, as in the API (ADR 0014). If Kafka is down the consumer simply waits;
        # consumer lag (Phase 5 metric) is the signal for that, not readiness.
        readiness:
          include: readinessState,db
          show-components: always
        liveness:
          include: livenessState
  tracing:
    sampling:
      # Applies only to traces this app starts; consumed records follow the API's decision.
      probability: 0.1
  metrics:
    tags:
      # Every metric carries the app name, so one dashboard can tell API and consumer apart.
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # Latency histograms, so Prometheus can compute p50/p95/p99 across instances (FR-11.3).
        http.server.requests: true
