# PSP simulator (ADR 0015). Local and CI use only; holds no secrets and no database.
server:
  port: 8090

spring:
  application:
    name: daybook-psp-sim
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
