# Prometheus pulls ("scrapes") each app's /actuator/prometheus endpoint on a fixed interval and
# evaluates the alert rules against what it collected.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: daybook-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]

  - job_name: daybook-consumer
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["consumer:8082"]
